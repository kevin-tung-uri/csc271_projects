<!DOCTYPE html>
<html>
<head>
<title>Recipe Submission</title>
</head>
<body>
    <form action="index.html">
        <p>Recipe Name:
            <input type="text" name="username"/>
        </p>
    </form>

    <form action="index.html">
        <p>Ingredients and instructions:</p>
        <textarea name="Ingredients" cols="20" rows="4"> List your ingredients...</textarea>
    </form>

    <form action="index.html">
        <p>Recipe Difficulty:
            <br />
            <input type="radio" name="Difficulty" value="Easy" checked="checked"/> Easy
            <input type="radio" name="Difficulty" value="Medium"/> Medium
            <input type="radio" name="Difficulty" value="Hard"/> Hard
        </p>
    
    <form action="index.html">
        <p>Dietary Preferences:
            <br />
            <input type="checkbox" name="Diet" value="Vegan"/> Vegan
            <input type="checkbox" name="Diet" value="Vegetarian"/> Vegatarian
            <input type="checkbox" name="Diet" value="Pescatarian"/> Pescatarian
            <input type="checkbox" name="Diet" value="Gluten-Free"/> Gluten-Free
            <input type="checkbox" name="Diet" value="Halal and Kosher"/> Halal and Kosher
        </p>

    <form action="index.html">
        <input type="submit" name="Submit" value="Submit" />
    </form>

</body>
</html>
